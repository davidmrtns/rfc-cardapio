name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  IS_PRODUCTION: ${{ github.event_name == 'push' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ env.IS_PRODUCTION == 'true' && 'Production' || 'Preview' }}
      url: ${{ steps.firebase-deploy.outputs.details_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Firebase Hosting
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ env.IS_PRODUCTION == 'true' && 'live' || '' }}

      - name: Add deployment URL to summary
        run: |
          echo "## 🚀 Firebase Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.IS_PRODUCTION == 'true' && 'Production' || 'Preview' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Access deployed application](${{ steps.firebase-deploy.outputs.details_url }})" >> $GITHUB_STEP_SUMMARY
